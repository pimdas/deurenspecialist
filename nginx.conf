server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    location / {
        try_files $uri $uri/ =404;
    }
    location /assets/ {
        expires 1h;
        try_files $uri =404;
    }
}
